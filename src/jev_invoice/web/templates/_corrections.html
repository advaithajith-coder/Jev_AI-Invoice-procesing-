<details class="action"><summary>Save a recurring purchase correction</summary>
<p>Record one corrected field and supporting evidence. It stays pending until validated on <a href="/corrections">Saved corrections</a>. This does not change or approve this invoice.</p>
<form action="/invoices/{{ invoice.id }}/corrections" method="post">
<div class="field-row"><div class="field"><label for="correction-line">Purchase line</label><select id="correction-line" name="line_no" required>{% for line in invoice.lines %}<option value="{{ line.line_no }}">{{ line.line_no }}. {{ line.description }}</option>{% endfor %}</select></div>
<div class="field"><label for="correction-value">Corrected field and value</label><select id="correction-value" name="choice" required><option value="">Choose a correction</option><optgroup label="Purchase category">{% for key, label in correction_categories.items() if key != 'unknown' %}<option value="purchase_category:{{ key }}">{{ key | replace('_',' ') | capitalize }}</option>{% endfor %}</optgroup><optgroup label="GL account">{% for account in gl_accounts if account.account_type in ['expense','cost_of_sales','asset'] and account.code != '9999' %}<option value="gl_account:{{ account.code }}">{{ account.code }} · {{ account.name }}</option>{% endfor %}</optgroup><optgroup label="Massachusetts tax treatment">{% for key, treatment in correction_tax_treatments.items() if treatment[1] is not none %}<option value="tax_treatment:{{ key }}">{{ key | capitalize }} · {{ treatment[1] }}%</option>{% endfor %}</optgroup></select></div></div>
<div class="field"><label for="correction-evidence">Evidence and reason for this correction</label><textarea id="correction-evidence" name="evidence" required maxlength="2000" placeholder="Quote the purchase details and explain the corrected value. For tax, confirm the purchase location and applicable treatment."></textarea></div>
<div class="field-row"><div class="field"><label for="correction-from">Valid from</label><input id="correction-from" name="valid_from" type="date" value="{{ today }}" required></div><div class="field"><label for="correction-until">Valid until (maximum one year)</label><input id="correction-until" name="valid_until" type="date" required></div><div class="field"><label for="correction-person">Your name</label><input id="correction-person" name="person" value="{{ reviewer }}" maxlength="100" required></div></div>
<button class="button">Save pending correction</button>
</form></details>
