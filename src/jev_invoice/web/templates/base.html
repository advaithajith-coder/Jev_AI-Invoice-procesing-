<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ company_short }} Accounts payable{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400..700;1,400&family=Source+Code+Pro:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ asset_version }}">
  <script src="{{ url_for('static', path='app.js') }}?v={{ asset_version }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="side">
      <a class="wordmark" href="/">
        <span class="wordmark__name">{{ company_short }}</span>
        <span class="wordmark__desk">Accounts payable</span>
      </a>
      <nav class="side__nav" aria-label="Main">
        <p class="side__group" id="nav-invoices">Invoices</p>
        <ul aria-labelledby="nav-invoices">
          <li><a href="/" {% if nav == "inbox" %}aria-current="page"{% endif %}>Inbox</a></li>
          <li><a href="/review" {% if nav == "review" %}aria-current="page"{% endif %}>Review queue</a></li>
          <li><a href="/payables" {% if nav == "payables" %}aria-current="page"{% endif %}>Payables</a></li>
          <li><a href="/exports" {% if nav == "exports" %}aria-current="page"{% endif %}>Exports</a></li>
          <li><a href="/workflow" {% if nav == "workflow" %}aria-current="page"{% endif %}>Workflow</a></li>
        </ul>
        <p class="side__group" id="nav-records">Records</p>
        <ul aria-labelledby="nav-records">
          <li><a href="/vendors" {% if nav == "vendors" %}aria-current="page"{% endif %}>Vendors</a></li>
          <li><a href="/purchase-orders" {% if nav == "pos" %}aria-current="page"{% endif %}>Purchase orders</a></li>
          <li><a href="/receiving" {% if nav == "receiving" %}aria-current="page"{% endif %}>Receiving</a></li>
          <li><a href="/accounts" {% if nav == "accounts" %}aria-current="page"{% endif %}>Chart of accounts</a></li>
          <li><a href="/settings" {% if nav == "settings" %}aria-current="page"{% endif %}>Settings</a></li>
        </ul>
      </nav>
      <p class="side__credit">Invoice processing by Jev</p>
    </header>
    <main id="main" class="sheet">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
