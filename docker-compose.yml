name: jev-invoice

x-app-env: &app-env
  APP_ENV: local
  LOG_JSON: "true"
  DATABASE_URL: postgresql+asyncpg://jev:jev@postgres:5432/jev_invoice
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: jev
      POSTGRES_DB: jev_invoice
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev_invoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file: [{ path: .env, required: false }]
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    env_file: [{ path: .env, required: false }]
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: [{ path: .env, required: false }]
    environment: *app-env
    command: ["arq", "jev_invoice.workers.settings.WorkerSettings"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
